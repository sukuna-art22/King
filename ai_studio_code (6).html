<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>my pomo2z</title>

    <!-- PWA / Install -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="my pomo2z">
    <meta name="apple-mobile-web-app-title" content="my pomo2z">
    <meta name="theme-color" content="#005AC1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon.svg">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.5s ease; }
        .android-card { border-radius: 32px; backdrop-filter: blur(10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .bar-transition { transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        input[type="range"] { -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #005AC1; cursor: pointer; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #DEE2F2; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#F8F9FF]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const IconTimer = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconCheck = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>;
        const IconStats = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>;
        const IconSettings = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;

        const TAGS = [
            { id: 'study', label: 'Study', color: '#005AC1', darkColor: '#ADC6FF' },
            { id: 'exercise', label: 'Exercise', color: '#006D3A', darkColor: '#76DA96' },
            { id: 'work', label: 'Work', color: '#6750A4', darkColor: '#D0BCFF' },
            { id: 'other', label: 'Other', color: '#44474E', darkColor: '#C4C6D0' }
        ];

        function App() {
            const [view, setView] = useState('timer');
            const [darkMode, setDarkMode] = useState(localStorage.getItem('dark_mode') === 'true');
            const [batteryLevel, setBatteryLevel] = useState(1);

            // Settings & History State
            const [focusMins, setFocusMins] = useState(parseInt(localStorage.getItem('set_focus') || 25, 10));
            const [breakMins, setBreakMins] = useState(parseInt(localStorage.getItem('set_break') || 5, 10));
            const [history, setHistory] = useState(JSON.parse(localStorage.getItem('pomo_history') || '[]'));
            const [tasks, setTasks] = useState(JSON.parse(localStorage.getItem('tasks') || '[]'));
            
            // Timer State
            const [mode, setMode] = useState('focus'); // focus | break
            const [timeLeft, setTimeLeft] = useState(focusMins * 60);
            const [isActive, setIsActive] = useState(false);
            const [activeTag, setActiveTag] = useState(TAGS[0]);

            // Keep localStorage in sync when settings change (so nothing is lost)
            useEffect(() => {
                localStorage.setItem('set_focus', String(focusMins));
            }, [focusMins]);
            useEffect(() => {
                localStorage.setItem('set_break', String(breakMins));
            }, [breakMins]);
            useEffect(() => {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }, [tasks]);
            useEffect(() => {
                localStorage.setItem('pomo_history', JSON.stringify(history));
            }, [history]);

            // Ensure timeLeft updates when user changes focus/break while timer is not running
            useEffect(() => {
                if (!isActive) {
                    setTimeLeft((mode === 'focus' ? focusMins : breakMins) * 60);
                }
            }, [focusMins, breakMins, mode, isActive]);

            // Battery Detection & Dark Mode Sync
            useEffect(() => {
                if (navigator.getBattery) {
                    navigator.getBattery().then(bat => {
                        const update = () => {
                            setBatteryLevel(bat.level);
                            if (bat.level < 0.20 && !bat.charging) setDarkMode(true);
                        };
                        bat.addEventListener('levelchange', update);
                        update();
                    }).catch(()=>{});
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('dark_mode', darkMode);
                document.body.style.backgroundColor = darkMode ? '#1A1C1E' : '#F8F9FF';
            }, [darkMode]);

            // Timer Logic
            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && isActive) {
                    handleTimerEnd();
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]);

            const handleTimerEnd = () => {
                setIsActive(false);
                if (mode === 'focus') {
                    const session = { tag: activeTag.id, duration: focusMins, date: new Date().toISOString() };
                    setHistory(prev => {
                        const newHistory = [...prev, session];
                        localStorage.setItem('pomo_history', JSON.stringify(newHistory));
                        return newHistory;
                    });
                    setMode('break');
                } else {
                    setMode('focus');
                }
            };

            // Statistics Helper for Weekly Bar Graph
            const weeklyStats = useMemo(() => {
                const days = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const label = d.toLocaleDateString('en-US', { weekday: 'short' });
                    const totalMins = history
                        .filter(h => new Date(h.date).toDateString() === d.toDateString())
                        .reduce((acc, curr) => acc + curr.duration, 0);
                    days.push({ label, value: totalMins });
                }
                const max = Math.max(...days.map(d => d.value), 60); // Min scale 60m
                return days.map(d => ({ ...d, height: (d.value / max) * 100 }));
            }, [history]);

            const currentTheme = darkMode ? "text-[#E2E2E6] bg-[#1A1C1E]" : "text-[#1A1C1E] bg-[#F8F9FF]";
            const cardTheme = darkMode ? "bg-[#2F3033] border-none shadow-none" : "bg-white/90 border border-white shadow-xl shadow-slate-100";

            return (
                <div className={`flex flex-col h-screen max-w-[1080px] mx-auto overflow-hidden transition-colors ${currentTheme}`}>
                    
                    {/* Header */}
                    <header className="pt-14 px-8 pb-4 flex justify-between items-start">
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight">my pomo2z</h1>
                            <p className={`${darkMode ? 'text-slate-400' : 'text-slate-500'} text-xs font-bold uppercase tracking-widest mt-1`}>
                                {view === 'timer' ? mode : view}
                            </p>
                        </div>
                        <button onClick={() => setDarkMode(!darkMode)} className={`p-3 rounded-2xl ${darkMode ? 'bg-blue-900 text-blue-200' : 'bg-blue-50 text-blue-600'}`}>
                            {darkMode ? "🌙 Night" : "☀️ Day"}
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 py-4 no-scrollbar pb-32">
                        
                        {view === 'timer' && (
                            <div className="space-y-6 animate-in fade-in zoom-in duration-300">
                                <div className="flex gap-2 overflow-x-auto no-scrollbar py-2">
                                    {TAGS.map(tag => (
                                        <button 
                                            key={tag.id}
                                            onClick={() => setActiveTag(tag)}
                                            className={`px-6 py-3 rounded-full text-sm font-semibold transition-all whitespace-nowrap ${activeTag.id === tag.id ? 'bg-blue-600 text-white shadow-lg' : darkMode ? 'bg-[#3E4044] text-slate-300' : 'bg-white text-slate-600'}`}
                                        >
                                            {tag.label}
                                        </button>
                                    ))}
                                </div>

                                <div className={`android-card aspect-square flex flex-col items-center justify-center transition-all duration-700 ${cardTheme}`}>
                                    <div className="text-[100px] font-light leading-none tracking-tighter">
                                        {Math.floor(timeLeft / 60)}<span className="opacity-20">:</span>{String(timeLeft % 60).padStart(2, '0')}
                                    </div>
                                    <div className={`mt-4 px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-[0.2em] ${mode === 'focus' ? 'bg-blue-600/10 text-blue-500' : 'bg-green-600/10 text-green-500'}`}>
                                        {mode === 'focus' ? activeTag.label : 'Taking a Break'}
                                    </div>
                                </div>

                                <div className="flex justify-center items-center gap-6">
                                    <button onClick={() => {setIsActive(false); setTimeLeft((mode === 'focus' ? focusMins : breakMins) * 60)}} className={`w-16 h-16 rounded-full flex items-center justify-center transition-colors ${darkMode ? 'bg-[#3E4044] text-slate-400' : 'bg-white text-slate-400'}`}>Reset</button>
                                    <button onClick={() => setIsActive(!isActive)} className={`w-24 h-24 rounded-[38px] flex items-center justify-center text-white shadow-2xl transition-all active:scale-90 ${mode === 'focus' ? 'bg-blue-600 shadow-blue-500/30' : 'bg-green-600 shadow-green-500/30'}`}>
                                        {isActive ? <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> : <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24" className="ml-1"><path d="M8 5v14l11-7z"/></svg>}
                                    </button>
                                    <button onClick={() => setMode(mode === 'focus' ? 'break' : 'focus')} className={`w-16 h-16 rounded-full flex items-center justify-center transition-colors ${darkMode ? 'bg-[#3E4044] text-slate-400' : 'bg-white text-slate-400'}`}>Skip</button>
                                </div>
                            </div>
                        )}

                        {view === 'stats' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom duration-500">
                                {/* Bar Graph Section */}
                                <div className={`android-card p-8 ${cardTheme}`}>
                                    <h3 className="text-xs font-bold uppercase tracking-widest mb-10 opacity-60 text-center">Last 7 Days (Minutes)</h3>
                                    <div className="flex justify-between items-end h-48 px-2 gap-3">
                                        {weeklyStats.map((day, idx) => (
                                            <div key={idx} className="flex-1 flex flex-col items-center gap-3">
                                                <div className="relative w-full h-full flex items-end">
                                                    <div 
                                                        className={`w-full rounded-t-xl bar-transition ${darkMode ? 'bg-blue-400/80' : 'bg-blue-600'}`}
                                                        style={{ height: `${day.height}%` }}
                                                    >
                                                        {day.value > 0 && <span className="absolute -top-6 left-1/2 -translate-x-1/2 text-[10px] font-bold">{day.value}</span>}
                                                    </div>
                                                </div>
                                                <span className="text-[10px] font-medium opacity-50 uppercase">{day.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Comparison Grid */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div className={`android-card p-6 ${cardTheme}`}>
                                        <p className="text-[10px] font-bold uppercase opacity-50">Today</p>
                                        <p className="text-3xl font-bold mt-1 text-blue-500">{weeklyStats[6].value}m</p>
                                    </div>
                                    <div className={`android-card p-6 ${cardTheme}`}>
                                        <p className="text-[10px] font-bold uppercase opacity-50">Yesterday</p>
                                        <p className="text-3xl font-bold mt-1 opacity-80">{weeklyStats[5].value}m</p>
                                    </div>
                                </div>

                                {/* Detailed Tags breakdown */}
                                <div className={`android-card p-8 ${cardTheme}`}>
                                    <h3 className="text-xs font-bold uppercase tracking-widest mb-6 opacity-60">Focus Distribution</h3>
                                    <div className="space-y-6">
                                        {TAGS.map(tag => {
                                            const total = history.filter(h => h.tag === tag.id).reduce((s,c)=>s+c.duration,0);
                                            return (
                                                <div key={tag.id}>
                                                    <div className="flex justify-between text-sm font-bold mb-2">
                                                        <span>{tag.label}</span>
                                                        <span>{total}m</span>
                                                    </div>
                                                    <div className={`w-full h-2 rounded-full overflow-hidden ${darkMode ? 'bg-white/5' : 'bg-slate-100'}`}>
                                                        <div className="h-full rounded-full transition-all" style={{ width: `${Math.min(total/2, 100)}%`, backgroundColor: darkMode ? tag.darkColor : tag.color }} />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'tasks' && (
                             <div className="space-y-4 animate-in slide-in-from-right duration-300">
                                <div className="flex gap-3 mb-4">
                                    <input 
                                        value={tasks.find(t=>!t.id)?.text || ""} 
                                        onChange={(e)=>setTasks([{id:0, text:e.target.value}, ...tasks.filter(t=>t.id!==0)])}
                                        onKeyDown={(e)=>{if(e.key==='Enter' && e.target.value){setTasks([{id:Date.now(), text:e.target.value, done:false}, ...tasks.filter(t=>t.id!==0)]);}}}
                                        placeholder="What's your goal?" 
                                        className={`flex-1 rounded-2xl px-6 py-4 shadow-sm outline-none ring-blue-500 focus:ring-2 ${darkMode ? 'bg-[#2F3033] border-none text-white' : 'bg-white border border-slate-100'}`} 
                                    />
                                </div>
                                {tasks.filter(t=>t.id!==0).map(t => (
                                    <div key={t.id} className={`android-card p-5 flex items-center gap-4 ${cardTheme}`}>
                                        <input type="checkbox" checked={t.done} onChange={() => setTasks(tasks.map(i => i.id === t.id ? {...i, done:!i.done} : i))} className="w-6 h-6 accent-blue-600 rounded-lg" />
                                        <span className={`flex-1 text-lg ${t.done ? 'line-through opacity-40' : ''}`}>{t.text}</span>
                                        <button onClick={() => setTasks(tasks.filter(i => i.id !== t.id))} className="text-red-400 text-xs font-bold">DEL</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="space-y-6 animate-in slide-in-from-left duration-300">
                                <div className={`android-card p-8 space-y-10 ${cardTheme}`}>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-widest opacity-60 mb-6">Focus Duration</label>
                                        <input type="range" min="1" max="120" value={focusMins} onChange={(e) => setFocusMins(parseInt(e.target.value, 10))} className="w-full h-2" />
                                        <div className="text-right mt-2 text-2xl font-bold text-blue-500">{focusMins}m</div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-widest opacity-60 mb-6">Break Duration</label>
                                        <input type="range" min="1" max="30" value={breakMins} onChange={(e) => setBreakMins(parseInt(e.target.value, 10))} className="w-full h-2" />
                                        <div className="text-right mt-2 text-2xl font-bold text-green-500">{breakMins}m</div>
                                    </div>
                                    <div className="pt-6 border-t border-slate-100/10 flex items-center justify-between">
                                        <span className="text-xs font-bold uppercase opacity-60">Battery Level</span>
                                        <span className={`text-xs font-bold ${batteryLevel < 0.2 ? 'text-red-500' : 'text-green-500'}`}>{Math.round(batteryLevel * 100)}%</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className={`fixed bottom-0 left-0 right-0 flex justify-around items-center px-4 transition-colors ${darkMode ? 'bg-[#1A1C1E] border-t border-white/5 h-[85px]' : 'bg-white border-t border-slate-100 h-[85px]'}`}>
                        <button onClick={() => setView('timer')} className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all ${view === 'timer' ? 'text-blue-500' : 'opacity-40 hover:opacity-100'}`}><IconTimer /><span className="text-[9px] font-bold uppercase">Timer</span></button>
                        <button onClick={() => setView('tasks')} className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all ${view === 'tasks' ? 'text-blue-500' : 'opacity-40 hover:opacity-100'}`}><IconCheck /><span className="text-[9px] font-bold uppercase">Tasks</span></button>
                        <button onClick={() => setView('stats')} className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all ${view === 'stats' ? 'text-blue-500' : 'opacity-40 hover:opacity-100'}`}><IconStats /><span className="text-[9px] font-bold uppercase">Stats</span></button>
                        <button onClick={() => setView('settings')} className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all ${view === 'settings' ? 'text-blue-500' : 'opacity-40 hover:opacity-100'}`}><IconSettings /><span className="text-[9px] font-bold uppercase">Settings</span></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Register service worker (for installability & offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered', reg.scope))
                    .catch(err => console.warn('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
